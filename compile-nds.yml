name: Compile and Commit NDS Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install devkitARM
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://github.com/devkitPro/pacman/releases/download/v1.0.2/devkitpro-pacman.amd64.deb
        sudo dpkg -i devkitpro-pacman.amd64.deb
        sudo dkp-pacman -Syyu --noconfirm
        sudo dkp-pacman -S devkitARM libnds libfat-nds ndstool --noconfirm
    
    - name: Set up environment
      run: |
        echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
        echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
        echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
    
    - name: Build the game
      run: |
        make clean
        make
    
    - name: Commit and push compiled NDS file
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add papas_burgeria.nds
        git commit -m "Auto-compiled NDS file from GitHub Actions" || true
        git push
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: Game Build ${{ github.run_number }}
        body: |
          Auto-compiled Papa's Burgeria DS build
          Download the .nds file to play in an emulator!
        files: papas_burgeria.nds
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
