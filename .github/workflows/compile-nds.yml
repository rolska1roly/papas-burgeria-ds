name: Build NDS Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile NDS
        run: |
          source /etc/profile.d/devkit-env.sh
          make

      - name: Upload NDS File
        uses: actions/upload-artifact@v4
        with:
          name: papas-burgeria-nds
          path: "*.nds"

